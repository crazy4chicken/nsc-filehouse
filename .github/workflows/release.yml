name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (vX.Y.Z)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            arch: x64
          - goarch: arm64
            arch: arm64
    steps:
      - name: Resolve version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "version must look like vX.Y.Z, got: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # svchost release contract: the asset must be named
      # filehouse_<version>_<arch>.zip and the entry binary must sit at
      # the ZIP root with the exact service name "filehouse".
      # The nats build tag compiles the teamusers SDK event subscriptions so a
      # deployment can set FILEHOUSE_TEAMUSERS_NATS_URL; without the tag
      # that setting only produces a warning.
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -trimpath -tags nats \
            -ldflags "-s -w -X main.version=$TAG" \
            -o dist/filehouse ./cmd/filehouse

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist
          zip "filehouse_${TAG#v}_${ARCH}.zip" filehouse

      # archive: false uploads the ZIP as-is; the artifact name becomes the
      # file name, which the publish job matches by pattern.
      - name: Upload asset
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: dist/*.zip
          archive: false
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        run: |
          TAG="${{ inputs.version || github.ref_name }}"
          echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "version must look like vX.Y.Z, got: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # skip-decompress: the uploads are raw .zip files (archive: false);
      # without this the client would unzip them and both architectures
      # would clobber the same bare "filehouse" entry.
      - name: Download assets
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: filehouse_*.zip
          path: dist
          merge-multiple: true
          skip-decompress: true

      # On manual dispatch the tag may not exist yet: gh release create
      # creates it at the dispatched ref. GH_REPO substitutes for the
      # missing git checkout in this job.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/*.zip --clobber

      # The compose template pins one digest per architecture; publishing them
      # in the run summary removes the manual download-and-hash step.
      - name: Report asset digests
        run: |
          {
            echo "### $TAG assets"
            echo
            echo '| asset | sha256 |'
            echo '| --- | --- |'
            for asset in dist/*.zip; do
              digest=$(sha256sum "$asset" | cut -d' ' -f1)
              echo "| $(basename "$asset") | $digest |"
              echo "$(basename "$asset") $digest"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
